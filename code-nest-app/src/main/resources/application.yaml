spring:
  application:
    name: code-nest
  docker:
    compose:
      # 应用的工作目录是 code-nest-app（IDEA 与 spring-boot:run 默认如此），compose 文件在仓库根目录
      file: ../compose.yaml
      lifecycle-management: start-only
  testcontainers:
    beans:
      # 只影响测试与 TestCodeNestApplication：并行启动 Testcontainers 容器，总耗时取决于最慢的 ES
      startup: parallel
  rabbitmq:
    publisher-confirm-type: correlated
    # 没有队列绑定的消息退回给生产者，按发送失败处理
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        # 本地重试 3 次，间隔 1s、2s、4s；之后拒绝消息，转入死信队列
        retry:
          enabled: true
          max-retries: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 4s
  flyway:
    # 各模块独立编号（V1_、V2_……），允许低编号模块后补迁移
    out-of-order: true

management:
  # 管理端点只在管理端口上提供，不经过 Sa-Token 鉴权，不能对外暴露
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,metrics,counter-reconcile,search-rebuild

feed:
  # 粉丝数不低于它的作者是大 V：发文不推送到粉丝的收件箱，读 Feed 时从其发件箱拉取
  big-author-threshold: 5000

hot:
  # 热度 = (like·点赞 + favorite·收藏 + comment·评论 + view·浏览) / (发布小时数 + 2)^gravity
  weight:
    like: 3
    favorite: 5
    comment: 4
    view: 0.1
  gravity: 1.5

rate-limit:
  # 总开关，压测时关闭
  enabled: true
  # 可信代理的 IP（如 Nginx），只有来自它们的请求才读取 X-Forwarded-For；默认不信任任何代理
  trusted-proxies: [ ]
  # 限流规则，接口上的 @RateLimit 按名字引用；多个接口引用同一个名字时共用额度
  rules:
    register-per-hour: { limit: 5, window: 1h, dimension: IP }
    login-per-minute: { limit: 10, window: 1m, dimension: IP }
    search-per-minute: { limit: 60, window: 1m, dimension: IP }
    publish-per-hour: { limit: 10, window: 1h, dimension: USER }
    # 评论与回复共用
    comment-per-minute: { limit: 10, window: 1m, dimension: USER }
    comment-per-day: { limit: 200, window: 1d, dimension: USER }
    # 点赞、收藏及其取消共用
    like-favorite-per-minute: { limit: 60, window: 1m, dimension: USER }
    # 关注与取关共用
    follow-per-minute: { limit: 30, window: 1m, dimension: USER }

sa-token:
  # 请求头为 Authorization: Bearer <uuid>
  token-name: Authorization
  token-prefix: Bearer
  token-style: uuid
  timeout: 604800
  active-timeout: -1
  is-concurrent: true
  is-share: false
  is-read-cookie: false
  is-read-body: false
  is-print: false

mybatis-plus:
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
