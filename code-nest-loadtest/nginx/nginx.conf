# 压测入口：把请求轮询分给两个应用实例
worker_processes 1;

events {
    worker_connections 4096;
}

http {
    access_log off;

    upstream app {
        server app-1:8080;
        server app-2:8080;
        # 与应用之间复用连接，避免压测时大量短连接
        keepalive 128;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            # 应用把本机（可信代理）发来的请求按 X-Forwarded-For 识别客户端 IP
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
