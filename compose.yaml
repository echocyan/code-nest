# 本地开发用中间件；应用在 IDEA 中运行，由 spring-boot-docker-compose 拉起并注入连接信息
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: code_nest
      MYSQL_USER: codenest
      MYSQL_PASSWORD: codenest
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:8.6
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  rabbitmq:
    image: rabbitmq:4.3.5-management
    environment:
      RABBITMQ_DEFAULT_USER: codenest
      RABBITMQ_DEFAULT_PASS: codenest
    ports:
      - "5672:5672"
      - "15672:15672"

  elasticsearch:
    build: docker/elasticsearch
    image: code-nest/elasticsearch-ik:9.4.5
    labels:
      org.springframework.boot.service-connection: elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data

volumes:
  mysql-data:
  redis-data:
  es-data:
